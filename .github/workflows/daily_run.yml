name: Daily Run

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
    - cron: '0 12 * * *' # Runs daily at noon UTC
  workflow_dispatch: # Allows manual triggering
  push:
    branches:
      - main

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@main

    - name: Run get_zipped.sh script
      run: bash ./scripts/get_zipped.sh

    - name: Update sitemap lastmod
      run: |
        stamp="$( (tr -d '[:space:]' < data/updated) 2>/dev/null || true)"
        if printf '%s' "$stamp" | grep -Eq '^[0-9]{8}_[0-9]{6}$'; then
          d="${stamp:0:4}-${stamp:4:2}-${stamp:6:2}"
          if [ "$(date -u -d "$d" +%F 2>/dev/null)" = "$d" ]; then
            sed -i.bak -E "s#<lastmod>[^<]*</lastmod>#<lastmod>${d}</lastmod>#" sitemap.xml && rm -f sitemap.xml.bak
          else
            echo "data/updated calendar date invalid; sitemap unchanged"
          fi
        else
          echo "data/updated missing or malformed; sitemap unchanged"
        fi

    - name: Commit and push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add .
        if git diff-index --quiet HEAD; then
          echo "No changes to commit"
        else
          git commit -m 'Update results from daily run'
          git push
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
